<svg viewBox="0 0 900 135" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Gradiente semitransparente da assinatura -->
    <linearGradient id="translucent-sig" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.78" />
      <stop offset="50%" stop-color="#D4D4D8" stop-opacity="0.64" />
      <stop offset="100%" stop-color="#A1A1AA" stop-opacity="0.48" />
    </linearGradient>

    <!-- Gradiente discreto para os códigos e subtítulo -->
    <linearGradient id="translucent-sub" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#D4D4D8" stop-opacity="0.62" />
      <stop offset="100%" stop-color="#A1A1AA" stop-opacity="0.48" />
    </linearGradient>
  </defs>

  <!-- FASE 1: Formas rápidas de "Hello, World" (0% a 26% do ciclo) -->
  <g font-family="ui-monospace, &#39;SF Mono&#39;, &#39;Cascadia Code&#39;, &#39;Fira Code&#39;, monospace" font-size="21" font-weight="400" letter-spacing="0.3" fill="url(#translucent-sub)" text-anchor="middle">

    <!-- 1. C: printf("Hello, World"); -->
    <text x="450" y="76" opacity="0">
      <animate attributeName="opacity" values="0; 1; 1; 0; 0" keyTimes="0; 0.015; 0.055; 0.07; 1" dur="14s" repeatCount="indefinite" />
      <animate attributeName="y" values="82; 76; 76; 70; 70" keyTimes="0; 0.015; 0.055; 0.07; 1" dur="14s" repeatCount="indefinite" />
      printf("Hello, World");
    </text>

    <!-- 2. HTML: <h1>Hello, World</h1> -->
    <text x="450" y="76" opacity="0">
      <animate attributeName="opacity" values="0; 0; 1; 1; 0; 0" keyTimes="0; 0.065; 0.08; 0.12; 0.135; 1" dur="14s" repeatCount="indefinite" />
      <animate attributeName="y" values="82; 82; 76; 76; 70; 70" keyTimes="0; 0.065; 0.08; 0.12; 0.135; 1" dur="14s" repeatCount="indefinite" />
      <h1>Hello, World</h1>
    </text>

    <!-- 3. Java: System.out.println("Hello, World"); -->
    <text x="450" y="76" opacity="0">
      <animate attributeName="opacity" values="0; 0; 1; 1; 0; 0" keyTimes="0; 0.13; 0.145; 0.185; 0.20; 1" dur="14s" repeatCount="indefinite" />
      <animate attributeName="y" values="82; 82; 76; 76; 70; 70" keyTimes="0; 0.13; 0.145; 0.185; 0.20; 1" dur="14s" repeatCount="indefinite" />
      System.out.println("Hello, World");
    </text>

    <!-- 4. Python: print("Hello, World") -->
    <text x="450" y="76" opacity="0">
      <animate attributeName="opacity" values="0; 0; 1; 1; 0; 0" keyTimes="0; 0.195; 0.21; 0.245; 0.275; 1" dur="14s" repeatCount="indefinite" />
      <animate attributeName="y" values="82; 82; 76; 76; 70; 70" keyTimes="0; 0.195; 0.21; 0.245; 0.275; 1" dur="14s" repeatCount="indefinite" />
      print("Hello, World")
    </text>
  </g>

  <!-- FASE 2: Assinatura "Tawan Cavalcante" escrita por cima (24% a 95% do ciclo) -->
  <g opacity="1">
    <animate attributeName="opacity" values="1; 1; 0; 0" keyTimes="0; 0.90; 0.95; 1" calcMode="spline" keySplines="0 0 1 1; 0.4 0 0.2 1; 0 0 1 1" dur="14s" repeatCount="indefinite" />

    <g transform="translate(7, -28)" fill="none" stroke="url(#translucent-sig)" stroke-width="6.8" stroke-linecap="round" stroke-linejoin="round">
      <!-- T (barra superior) -->
      <path d="M 158 66 C 174 56, 192 56, 206 62 C 216 66, 224 62, 232 56" pathLength="100" stroke-dasharray="100" stroke-dashoffset="100" opacity="0">
        <animate attributeName="opacity" values="0; 1; 0" keyTimes="0; 0.24; 0.96" calcMode="discrete" dur="14s" repeatCount="indefinite" />
        <animate attributeName="stroke-dashoffset" values="100; 100; 0; 0" keyTimes="0; 0.24; 0.27; 1" dur="14s" repeatCount="indefinite" />
      </path>

      <!-- T (haste) -->
      <path d="M 195 60 C 191 82, 186 104, 178 114 C 171 121, 162 117, 165 108" pathLength="100" stroke-dasharray="100" stroke-dashoffset="100" opacity="0">
        <animate attributeName="opacity" values="0; 1; 0" keyTimes="0; 0.265; 0.96" calcMode="discrete" dur="14s" repeatCount="indefinite" />
        <animate attributeName="stroke-dashoffset" values="100; 100; 0; 0" keyTimes="0; 0.265; 0.295; 1" dur="14s" repeatCount="indefinite" />
      </path>

      <!-- a -->
      <path d="M 228 91 C 221 85, 208 87, 204 99 C 200 111, 211 119, 223 110 C 227 106, 229 97, 230 89 C 229 102, 229 113, 236 116 C 240 117, 244 110, 247 98" pathLength="100" stroke-dasharray="100" stroke-dashoffset="100" opacity="0">
        <animate attributeName="opacity" values="0; 1; 0" keyTimes="0; 0.29; 0.96" calcMode="discrete" dur="14s" repeatCount="indefinite" />
        <animate attributeName="stroke-dashoffset" values="100; 100; 0; 0" keyTimes="0; 0.29; 0.32; 1" dur="14s" repeatCount="indefinite" />
      </path>

      <!-- w -->
      <path d="M 247 98 L 250 89 C 249 105, 252 116, 259 116 C 265 116, 267 103, 270 90 C 270 105, 273 116, 280 116 C 286 116, 289 103, 291 89 C 293 93, 296 94, 300 92" pathLength="100" stroke-dasharray="100" stroke-dashoffset="100" opacity="0">
        <animate attributeName="opacity" values="0; 1; 0" keyTimes="0; 0.315; 0.96" calcMode="discrete" dur="14s" repeatCount="indefinite" />
        <animate attributeName="stroke-dashoffset" values="100; 100; 0; 0" keyTimes="0; 0.315; 0.35; 1" dur="14s" repeatCount="indefinite" />
      </path>

      <!-- an -->
      <path d="M 322 91 C 315 85, 302 87, 298 99 C 294 111, 305 119, 317 110 C 321 106, 323 97, 324 89 C 323 102, 323 113, 330 116 C 334 113, 336 98, 339 89 C 338 99, 338 109, 338 116 C 340 99, 346 88, 352 88 C 358 88, 358 97, 357 109 C 357 115, 363 118, 371 110" pathLength="100" stroke-dasharray="100" stroke-dashoffset="100" opacity="0">
        <animate attributeName="opacity" values="0; 1; 0" keyTimes="0; 0.345; 0.96" calcMode="discrete" dur="14s" repeatCount="indefinite" />
        <animate attributeName="stroke-dashoffset" values="100; 100; 0; 0" keyTimes="0; 0.345; 0.385; 1" dur="14s" repeatCount="indefinite" />
      </path>

      <!-- C -->
      <path d="M 444 69 C 438 57, 420 56, 409 71 C 398 87, 401 112, 420 116 C 431 118, 440 111, 446 102" pathLength="100" stroke-dasharray="100" stroke-dashoffset="100" opacity="0">
        <animate attributeName="opacity" values="0; 1; 0" keyTimes="0; 0.39; 0.96" calcMode="discrete" dur="14s" repeatCount="indefinite" />
        <animate attributeName="stroke-dashoffset" values="100; 100; 0; 0" keyTimes="0; 0.39; 0.42; 1" dur="14s" repeatCount="indefinite" />
      </path>

      <!-- av -->
      <path d="M 471 91 C 464 85, 451 87, 447 99 C 443 111, 454 119, 466 110 C 470 106, 472 97, 473 89 C 472 102, 472 113, 479 116 C 483 116, 486 108, 488 94 L 490 89 C 490 104, 493 116, 500 116 C 506 116, 509 103, 511 89 C 513 93, 516 94, 520 92" pathLength="100" stroke-dasharray="100" stroke-dashoffset="100" opacity="0">
        <animate attributeName="opacity" values="0; 1; 0" keyTimes="0; 0.415; 0.96" calcMode="discrete" dur="14s" repeatCount="indefinite" />
        <animate attributeName="stroke-dashoffset" values="100; 100; 0; 0" keyTimes="0; 0.415; 0.445; 1" dur="14s" repeatCount="indefinite" />
      </path>

      <!-- al -->
      <path d="M 543 91 C 536 85, 523 87, 519 99 C 515 111, 526 119, 538 110 C 542 106, 544 97, 545 89 C 544 102, 544 113, 551 116 C 558 106, 569 74, 568 62 C 567 57, 561 58, 560 65 C 558 80, 557 102, 560 112 C 562 117, 568 116, 575 107" pathLength="100" stroke-dasharray="100" stroke-dashoffset="100" opacity="0">
        <animate attributeName="opacity" values="0; 1; 0" keyTimes="0; 0.44; 0.96" calcMode="discrete" dur="14s" repeatCount="indefinite" />
        <animate attributeName="stroke-dashoffset" values="100; 100; 0; 0" keyTimes="0; 0.44; 0.475; 1" dur="14s" repeatCount="indefinite" />
      </path>

      <!-- c -->
      <path d="M 598 92 C 591 86, 579 88, 577 101 C 575 113, 586 119, 598 111 C 601 108, 604 104, 606 100" pathLength="100" stroke-dasharray="100" stroke-dashoffset="100" opacity="0">
        <animate attributeName="opacity" values="0; 1; 0" keyTimes="0; 0.47; 0.96" calcMode="discrete" dur="14s" repeatCount="indefinite" />
        <animate attributeName="stroke-dashoffset" values="100; 100; 0; 0" keyTimes="0; 0.47; 0.495; 1" dur="14s" repeatCount="indefinite" />
      </path>

      <!-- an -->
      <path d="M 626 91 C 619 85, 606 87, 602 99 C 598 111, 609 119, 621 110 C 625 106, 627 97, 628 89 C 627 102, 627 113, 634 116 C 638 113, 640 98, 643 89 C 642 99, 642 109, 642 116 C 644 99, 650 88, 656 88 C 662 88, 662 97, 661 109 C 661 115, 666 117, 674 108" pathLength="100" stroke-dasharray="100" stroke-dashoffset="100" opacity="0">
        <animate attributeName="opacity" values="0; 1; 0" keyTimes="0; 0.49; 0.96" calcMode="discrete" dur="14s" repeatCount="indefinite" />
        <animate attributeName="stroke-dashoffset" values="100; 100; 0; 0" keyTimes="0; 0.49; 0.525; 1" dur="14s" repeatCount="indefinite" />
      </path>

      <!-- te -->
      <path d="M 674 108 C 680 96, 685 78, 686 65 C 685 82, 683 100, 685 111 C 687 117, 693 116, 701 106 C 709 98, 713 92, 709 88 C 704 85, 697 91, 697 102 C 697 113, 706 118, 717 113 C 722 110, 725 106, 728 102" pathLength="100" stroke-dasharray="100" stroke-dashoffset="100" opacity="0">
        <animate attributeName="opacity" values="0; 1; 0" keyTimes="0; 0.52; 0.96" calcMode="discrete" dur="14s" repeatCount="indefinite" />
        <animate attributeName="stroke-dashoffset" values="100; 100; 0; 0" keyTimes="0; 0.52; 0.55; 1" dur="14s" repeatCount="indefinite" />
      </path>

      <!-- t (corte) -->
      <path d="M 675 82 C 683 80, 692 80, 700 81" pathLength="100" stroke-dasharray="100" stroke-dashoffset="100" opacity="0">
        <animate attributeName="opacity" values="0; 1; 0" keyTimes="0; 0.545; 0.96" calcMode="discrete" dur="14s" repeatCount="indefinite" />
        <animate attributeName="stroke-dashoffset" values="100; 100; 0; 0" keyTimes="0; 0.545; 0.565; 1" dur="14s" repeatCount="indefinite" />
      </path>
    </g>

    <!-- FASE 3: "software engineer" abaixo de "Cavalcante" -->
    <text x="733" y="122" text-anchor="end" opacity="0" font-family="-apple-system, BlinkMacSystemFont, &#39;SF Pro Text&#39;, &#39;Segoe UI&#39;, Roboto, Helvetica, Arial, sans-serif" font-size="16" font-weight="400" letter-spacing="2.2" fill="url(#translucent-sub)">
      <animate attributeName="opacity" values="0; 0; 1; 1" keyTimes="0; 0.53; 0.60; 1" calcMode="spline" keySplines="0 0 1 1; 0.16 1 0.3 1; 0 0 1 1" dur="14s" repeatCount="indefinite" />
      <animate attributeName="y" values="122; 122; 114; 114" keyTimes="0; 0.53; 0.60; 1" calcMode="spline" keySplines="0 0 1 1; 0.16 1 0.3 1; 0 0 1 1" dur="14s" repeatCount="indefinite" />
      software engineer
    </text>
  </g>
</svg>